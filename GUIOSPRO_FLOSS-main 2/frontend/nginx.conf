server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Los ficheros con hash en el nombre no cambian nunca: caché larga. Si uno no
    # existe (un navegador con un index.html de una versión anterior), 404 en vez
    # de devolver index.html, que el navegador intentaría ejecutar como script.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html se revalida en cada carga: tras reconstruir la imagen el
    # navegador recibe siempre la lista de assets vigente.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
